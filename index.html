<style>
/* Layout: herramienta de trabajo — barra fija con meta del día y filtros, lista de leads en filas; info a la izquierda, mensaje + acciones a la derecha. */
:root {
  --bg: #F3F5F2;
  --surface: #FFFFFF;
  --ink: #17201C;
  --muted: #5B6862;
  --line: #DAE0DB;
  --accent: #1D6A51;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EFE9;
  --st-pend: #6B746F;
  --st-env: #2B5DA8;
  --st-resp: #A4660E;
  --st-int: #1C7A44;
  --st-desc: #8C918E;
  --warn-soft: #FBEFD9;
  --warn-ink: #7A4B05;
  --bad-soft: #F8E2DF;
  --bad-ink: #8E2A1E;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201D; --ink: #E4EAE6; --muted: #97A49D; --line: #2A332F;
    --accent: #4BB28B; --accent-ink: #0D1512; --accent-soft: #1C2E27;
    --st-pend: #8F9993; --st-env: #7EA6E6; --st-resp: #E0A44A; --st-int: #5CC98A; --st-desc: #6D7470;
    --warn-soft: #3A2E17; --warn-ink: #F0C27A; --bad-soft: #3B1F1B; --bad-ink: #F3A396;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201D; --ink: #E4EAE6; --muted: #97A49D; --line: #2A332F;
  --accent: #4BB28B; --accent-ink: #0D1512; --accent-soft: #1C2E27;
  --st-pend: #8F9993; --st-env: #7EA6E6; --st-resp: #E0A44A; --st-int: #5CC98A; --st-desc: #6D7470;
  --warn-soft: #3A2E17; --warn-ink: #F0C27A; --bad-soft: #3B1F1B; --bad-ink: #F3A396;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 14px 12px; display: grid; gap: 12px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--font-body); font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.today { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
.today b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.pipe { display: flex; flex-wrap: wrap; gap: 6px; }
.pipe button { font: inherit; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.pipe button .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.pipe button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pipe button[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters select, .filters input { font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.filters input { flex: 1 1 180px; }
.filters select { flex: 0 1 auto; }
.notice { font-size: 0.82rem; padding: 8px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn-ink); }

/* Lista */
main .wrap { padding-block: 16px 48px; display: grid; gap: 10px; }
.count { font-size: 0.82rem; color: var(--muted); }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); border-left: 4px solid var(--st-pend); }
.lead[data-s="enviado"] { border-left-color: var(--st-env); }
.lead[data-s="respondio"] { border-left-color: var(--st-resp); }
.lead[data-s="interesado"] { border-left-color: var(--st-int); }
.lead[data-s="descartado"] { border-left-color: var(--st-desc); opacity: .72; }
.info { padding: 14px 16px; display: grid; gap: 8px; align-content: start; border-right: 1px solid var(--line); min-width: 0; }
.name { font-family: var(--font-display); font-weight: 500; font-size: 1.08rem; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 0.84rem; color: var(--muted); }
.meta .rev { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.74rem; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.bad { background: var(--bad-soft); color: var(--bad-ink); }
.tag.warn { background: var(--warn-soft); color: var(--warn-ink); }
.tag.ch { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.phone { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.88rem; }
.mini { font: inherit; font-family: var(--font-body); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.mini:hover { color: var(--ink); border-color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.82rem; }
.links a { color: var(--muted); text-underline-offset: 2px; overflow-wrap: anywhere; }
.links a:hover { color: var(--ink); }
.work { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
textarea { font: inherit; font-size: 0.88rem; line-height: 1.5; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; resize: vertical; min-height: 9.5em; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { font: inherit; font-size: 0.86rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
.status { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
.status button { font: inherit; font-size: 0.78rem; padding: 6px 9px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.status button:last-child { border-right: 0; }
.status button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
.note { font: inherit; font-size: 0.84rem; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 4px 0; width: 100%; }
.note:focus { outline: none; border-bottom-color: var(--accent); }
.hint { font-size: 0.78rem; color: var(--muted); }
.edited { font-size: 0.74rem; color: var(--accent); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); font-size: 0.85rem; padding: 8px 14px; border-radius: 6px; z-index: 20; }

@media (max-width: 760px) {
  .lead { grid-template-columns: minmax(0, 1fr); }
  .info { border-right: 0; border-bottom: 1px solid var(--line); }
  .status { margin-left: 0; width: 100%; }
  .status button { flex: 1 1 auto; justify-content: center; }
  .meter { width: 80px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const STATES = [
  { k: "pendiente",  label: "Pendiente",  color: "var(--st-pend)" },
  { k: "enviado",    label: "Enviado",    color: "var(--st-env)" },
  { k: "respondio",  label: "Respondió",  color: "var(--st-resp)" },
  { k: "interesado", label: "Interesado", color: "var(--st-int)" },
  { k: "descartado", label: "Descartado", color: "var(--st-desc)" },
];
const WEB_TAG = {
  sin_web: ["Sin web", "bad"], dominio_caido: ["Dominio caído", "bad"], web_error: ["Web con error", "bad"],
  timeout: ["Web no responde", "warn"], ssl_roto: ["Sitio no seguro", "warn"], solo_redes: ["Solo redes", "warn"],
  sin_https: ["Sin HTTPS", ""], no_mobile: ["No se adapta al celular", ""],
};
const CANAL = { whatsapp: "Celular", fijo: "Fijo", instagram: "Instagram", facebook: "Facebook", maps: "Sin teléfono" };

// ---------- estado ----------
const track = {};          // id -> {s, nota, msg, t}
let db = null, col = null, local = false;
let filter = { s: "pendiente", q: "", city: "", canal: "", web: "", seg: "" };

const get = id => track[id] || {};
const statusOf = id => get(id).s || "pendiente";
const msgOf = l => get(l.id).msg || l.msg;

function lsLoad() { try { return JSON.parse(localStorage.getItem("tracta-leads") || "{}"); } catch (e) { return {}; } }
function lsSave() { try { localStorage.setItem("tracta-leads", JSON.stringify(track)); } catch (e) {} }

async function save(id, patch) {
  const next = Object.assign({}, get(id), patch);
  track[id] = next;
  if (col) {
    try { await col.doc(id).set(next); }
    catch (e) { toast(e && e.code === "quota_exceeded" ? "No se pudo guardar: se llenó el espacio." : "No se pudo guardar. Probá de nuevo."); }
  } else { lsSave(); }
  refreshMeta();
}

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function waLink(l) { return "https://wa.me/" + l.wa + "?text=" + encodeURIComponent(msgOf(l)); }
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast("Copiado"); }
  catch (e) {
    const ta = btn.closest(".lead")?.querySelector("textarea");
    if (ta && ta.value === text) { ta.focus(); ta.select(); toast("Seleccionado: copialo con Ctrl+C"); }
    else toast("No se pudo copiar");
  }
}
const isToday = t => t && new Date(t).toDateString() === new Date().toDateString();

// ---------- filtros ----------
function matches(l) {
  const f = filter;
  if (f.s && statusOf(l.id) !== f.s) return false;
  if (f.city && l.ciudad !== f.city) return false;
  if (f.canal) {
    if (f.canal === "redes" ? !["instagram", "facebook"].includes(l.canal) : l.canal !== f.canal) return false;
  }
  if (f.web) {
    if (f.web === "rota" ? !["dominio_caido", "web_error", "timeout", "ssl_roto", "no_mobile", "sin_https"].includes(l.estado) : l.estado !== f.web) return false;
  }
  if (f.seg && l.seg !== f.seg) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    if (!(l.nombre + " " + l.rubro + " " + l.dir).toLowerCase().includes(q)) return false;
  }
  return true;
}

function setupFilters() {
  const cities = [...new Set(LEADS.map(l => l.ciudad))].sort();
  $("#fCity").innerHTML = '<option value="">Todas las ciudades</option>' + cities.map(c => `<option>${esc(c)}</option>`).join("");
  const segs = [...new Set(LEADS.map(l => l.seg))].sort();
  $("#fSeg").innerHTML = '<option value="">Todos los rubros</option>' + segs.map(c => `<option value="${esc(c)}">${esc(c.charAt(0).toUpperCase() + c.slice(1))}</option>`).join("");
  $("#q").addEventListener("input", e => { filter.q = e.target.value.trim(); render(); });
  $("#fCity").addEventListener("change", e => { filter.city = e.target.value; render(); });
  $("#fCanal").addEventListener("change", e => { filter.canal = e.target.value; render(); });
  $("#fWeb").addEventListener("change", e => { filter.web = e.target.value; render(); });
  $("#fSeg").addEventListener("change", e => { filter.seg = e.target.value; render(); });
}

function refreshMeta() {
  const counts = Object.fromEntries(STATES.map(s => [s.k, 0]));
  LEADS.forEach(l => counts[statusOf(l.id)]++);
  const pipe = $("#pipe");
  pipe.innerHTML = STATES.map(s => `<button type="button" data-k="${s.k}" aria-pressed="${filter.s === s.k}"><span class="dot" style="background:${s.color}"></span>${s.label} <span class="n">${counts[s.k]}</span></button>`).join("")
    + `<button type="button" data-k="" aria-pressed="${filter.s === ""}">Todos <span class="n">${LEADS.length}</span></button>`;
  const sent = Object.values(track).filter(t => t.s && t.s !== "pendiente" && isToday(t.t)).length;
  $("#todayN").textContent = sent;
  $("#todayBar").style.width = Math.min(100, sent / 20 * 100) + "%";
}

// ---------- tarjetas ----------
function card(l) {
  const st = statusOf(l.id), tr = get(l.id);
  const [wl, wc] = WEB_TAG[l.estado] || [l.estado, ""];
  const edited = tr.msg && tr.msg !== l.msg;
  let primary = "";
  if (l.wa) {
    primary = `<a class="btn" data-act="wa" href="${waLink(l)}" target="_blank" rel="noopener">${l.canal === "fijo" ? "Probar WhatsApp" : "Abrir WhatsApp"}</a>`;
  } else if (l.red) {
    primary = `<a class="btn" data-act="red" href="${esc(l.red)}" target="_blank" rel="noopener">Abrir ${l.canal === "instagram" ? "Instagram" : "Facebook"}</a>`;
  } else {
    primary = `<a class="btn" href="${esc(l.maps)}" target="_blank" rel="noopener">Ver en Maps</a>`;
  }
  const hint = l.canal === "fijo" ? "Es un fijo: si WhatsApp dice que no está registrado, llamalo."
    : l.canal === "instagram" || l.canal === "facebook" ? "No tiene teléfono: copiá el mensaje y mandalo por mensaje directo."
    : l.canal === "maps" ? "Sin teléfono ni redes en Google: buscalo en Instagram desde Maps." : "";
  return `<article class="lead" data-id="${l.id}" data-s="${st}">
    <div class="info">
      <h2 class="name">${esc(l.nombre)}</h2>
      <div class="meta">${esc(l.rubro)} · ${esc(l.ciudad)}${l.rev ? ` · <span class="rev">${l.rev} reseñas${l.rating ? " · " + esc(l.rating) + "★" : ""}</span>` : ""}</div>
      <div class="tags"><span class="tag ${wc}">${wl}</span><span class="tag ch">${CANAL[l.canal]}</span></div>
      ${l.tel ? `<div class="phone"><span>${esc(l.tel)}</span><button class="mini" type="button" data-act="copytel">Copiar</button></div>` : ""}
      <div class="links">
        <a href="${esc(l.maps)}" target="_blank" rel="noopener">Google Maps</a>
        ${l.web ? `<a href="${esc(/^https?:/i.test(l.web) ? l.web : "http://" + l.web)}" target="_blank" rel="noopener">Su link actual</a>` : ""}
      </div>
    </div>
    <div class="work">
      <textarea id="msg-${l.id}" aria-label="Mensaje para ${esc(l.nombre)}">${esc(msgOf(l))}</textarea>
      <div class="actions">
        ${primary}
        <button class="btn ghost" type="button" data-act="copy">Copiar mensaje</button>
        ${edited ? `<button class="mini" type="button" data-act="reset">Restaurar original</button>` : ""}
        <div class="status" role="group" aria-label="Estado">
          ${STATES.map(s => `<button type="button" data-st="${s.k}" aria-pressed="${st === s.k}"><span class="dot" style="background:${s.color}"></span>${s.label}</button>`).join("")}
        </div>
      </div>
      ${hint ? `<div class="hint">${hint}</div>` : ""}
      <input class="note" id="note-${l.id}" type="text" placeholder="Nota (ej: me pidió que escriba el lunes)" value="${esc(tr.nota || "")}" aria-label="Nota">
    </div>
  </article>`;
}

function render() {
  const rows = LEADS.filter(matches);
  $("#count").textContent = rows.length === 1 ? "1 lead" : rows.length + " leads";
  $("#list").innerHTML = rows.length ? rows.map(card).join("")
    : `<div class="empty">No hay leads con estos filtros.</div>`;
  refreshMeta();
}

function updateCard(id) {
  const el = document.querySelector(`.lead[data-id="${id}"]`);
  if (!el) return;
  const l = LEADS.find(x => x.id === id);
  if (filter.s && statusOf(id) !== filter.s) { el.remove(); $("#count").textContent = LEADS.filter(matches).length + " leads"; return; }
  if (el.contains(document.activeElement)) {
    el.dataset.s = statusOf(id);
    el.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", b.dataset.st === statusOf(id)));
    return;
  }
  el.outerHTML = card(l);
}

// ---------- eventos ----------
document.addEventListener("click", e => {
  const pb = e.target.closest("#pipe button");
  if (pb) { filter.s = pb.dataset.k; render(); window.scrollTo({ top: 0 }); return; }
  const lead = e.target.closest(".lead");
  if (!lead) return;
  const id = lead.dataset.id, l = LEADS.find(x => x.id === id);
  const stb = e.target.closest("[data-st]");
  if (stb) {
    const s = stb.dataset.st;
    save(id, { s, t: Date.now() }).then(() => updateCard(id));
    lead.dataset.s = s;
    lead.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", b.dataset.st === s));
    if (filter.s && filter.s !== s) setTimeout(() => updateCard(id), 600);
    return;
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "copy") copy(lead.querySelector("textarea").value, e.target);
  if (act === "copytel") copy(l.tel, e.target);
  if (act === "reset") { save(id, { msg: "" }).then(() => { lead.outerHTML = card(l); }); }
  if ((act === "wa" || act === "red") && statusOf(id) === "pendiente") {
    if (act === "red") copy(lead.querySelector("textarea").value, e.target);
    save(id, { s: "enviado", t: Date.now() });
    lead.dataset.s = "enviado";
    lead.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", b.dataset.st === "enviado"));
    toast("Marcado como enviado");
    if (filter.s === "pendiente") setTimeout(() => updateCard(id), 1500);
  }
});

// Mensaje editado: actualizar link al instante, guardar al salir del campo
document.addEventListener("input", e => {
  if (e.target.tagName !== "TEXTAREA") return;
  const lead = e.target.closest(".lead"), l = LEADS.find(x => x.id === lead.dataset.id);
  const a = lead.querySelector('[data-act="wa"]');
  if (a && l.wa) a.href = "https://wa.me/" + l.wa + "?text=" + encodeURIComponent(e.target.value);
});
document.addEventListener("change", e => {
  const lead = e.target.closest(".lead");
  if (!lead) return;
  const id = lead.dataset.id, l = LEADS.find(x => x.id === id);
  if (e.target.tagName === "TEXTAREA") {
    const v = e.target.value;
    save(id, { msg: v === l.msg ? "" : v });
  }
  if (e.target.classList.contains("note")) save(id, { nota: e.target.value.trim() });
});

// ---------- arranque ----------
setupFilters();
Object.assign(track, lsLoad());
render();

(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { local = true; $("#localNote").hidden = false; return; }
  col = db.collection("seguimiento");
  let first = true;
  col.onSnapshot(snap => {
    const changed = [];
    snap.docChanges().forEach(ch => {
      if (ch.type === "removed") delete track[ch.doc.id];
      else track[ch.doc.id] = Object.assign({}, ch.doc.data());
      changed.push(ch.doc.id);
    });
    if (first) { first = false; render(); }
    else { changed.forEach(updateCard); refreshMeta(); }
  }, () => { $("#localNote").hidden = false; col = null; });
})();
</script>

</body></html>
